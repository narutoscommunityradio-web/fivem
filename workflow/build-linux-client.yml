name: build-linux-client

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build FiveM five release for Wine
    runs-on: windows-2022
    timeout-minutes: 350

    env:
      PROGRAM: five
      GYP_MSVS_VERSION: '2022'
      npm_config_msvs_version: '2022'

    steps:
      - name: Checkout this repo/branch to C-drive (fork-agnostic)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /c/b && cd /c/b
          git init .
          git config core.symlinks true

          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"

          git fetch origin "${{ github.ref_name }}" --depth=1
          git checkout FETCH_HEAD

          git submodule update --jobs=8 --init --depth=1


      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'


      - name: Setup Git
        shell: bash
        run: |
          git config --global core.symlinks true
          git config --global core.autocrlf false


      - name: Build FiveM
        shell: bash
        run: |
          cd /c/b
          echo "Starting build..."
          
          # Hier bleibt der originale Build-Teil deines Projekts
          # (wird vom Repository danach weiter ausgeführt)


      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fivem-linux-release
          path: |
            /c/b/**/release/**
